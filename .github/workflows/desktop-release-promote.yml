name: Promote Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to restore
        required: true
        type: string
      notify_feishu:
        description: Unused during rollback
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  restore-stable-pointer:
    if: ${{ inputs.release_tag == 'v0.2.26' }}
    runs-on: ubuntu-latest
    environment: desktop-stable-release
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TUTTI_ARTIFACTS_AWS_ROLE_ARN: ${{ vars.TUTTI_ARTIFACTS_AWS_ROLE_ARN }}
      TUTTI_DESKTOP_RELEASE_ASSETS_BASE_URL: ${{ vars.TUTTI_DESKTOP_RELEASE_ASSETS_BASE_URL }}
      TUTTI_DESKTOP_RELEASE_ASSETS_S3_BUCKET: ${{ vars.TUTTI_DESKTOP_RELEASE_ASSETS_S3_BUCKET }}
      TUTTI_DESKTOP_RELEASE_ASSETS_S3_PREFIX: ${{ vars.TUTTI_DESKTOP_RELEASE_ASSETS_S3_PREFIX }}
    steps:
      - name: Checkout previous stable release
        uses: actions/checkout@v6
        with:
          ref: v0.2.26

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Download previous stable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v0.2.26 --dir release-assets

      - name: Rebuild previous stable pointer
        env:
          RELEASE_ASSET_BASE_URL: ${{ env.TUTTI_DESKTOP_RELEASE_ASSETS_BASE_URL }}
          RELEASE_CHANNEL: stable
          RELEASED_AT: "2026-08-15T12:49:02Z"
          RELEASE_GIT_SHA: 3f84c97885df2d2cc5b065baa6e4a7ba11a29942
          RELEASE_SOURCE_REF: release/0813
          RELEASE_TAG: v0.2.26
        run: node apps/desktop/scripts/build-release-latest.mjs release-assets release-latest.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TUTTI_ARTIFACTS_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Restore stable update pointer and changelog
        run: |
          prefix="${TUTTI_DESKTOP_RELEASE_ASSETS_S3_PREFIX%/}"
          root="s3://${TUTTI_DESKTOP_RELEASE_ASSETS_S3_BUCKET}/${prefix}"
          aws s3 cp release-latest.json "${root}/latest.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"
          aws s3 cp "${root}/changelog.json" changelog.json
          jq 'if (.entries | type) == "array" then .entries |= map(select(.tag != "v0.2.27" and .version != "0.2.27")) else . end' \
            changelog.json > restored-changelog.json
          aws s3 cp restored-changelog.json "${root}/changelog.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=60"

      - name: Verify restored stable pointer
        run: |
          prefix="${TUTTI_DESKTOP_RELEASE_ASSETS_S3_PREFIX%/}"
          root="s3://${TUTTI_DESKTOP_RELEASE_ASSETS_S3_BUCKET}/${prefix}"
          aws s3 cp "${root}/latest.json" restored-latest.json
          test "$(jq -r .tag restored-latest.json)" = "v0.2.26"
