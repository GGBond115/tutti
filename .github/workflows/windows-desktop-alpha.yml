name: Windows Desktop Alpha

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - codex/windows-desktop-alpha-v2

concurrency:
  group: windows-desktop-alpha-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-package:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.5"
          cache-dependency-path: |
            go.work
            go.work.sum
            packages/agent/daemon/go.mod
            packages/agent/daemon/go.sum
            services/tuttid/go.mod
            services/tuttid/go.sum

      - name: Install dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Generate Onboarding fat package
        shell: pwsh
        run: pnpm generate:builtin-apps

      - name: Test Windows agent process adapters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location packages/agent/daemon
          go test ./runtime -run 'Test(RunVerifiedExecutableUsesVerifiedIdentity|PrepareProcessExecutableExecutesVerifiedDescriptorAfterPathReplacement)$'
          go test ./runtimecmd -run 'TestResolver(ResolveAllReturnsEveryExecutableMatchInPathOrder|ResolveAllNamesKeepsDirectoryOrderBeforeLauncherVariant)$'
          Pop-Location

      - name: Test Windows daemon adapters
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Push-Location services/tuttid
          go test ./data/workspace -run 'Test(SQLiteDSNPathUsesFileURLFormOnWindows|SQLiteStoreListEmptyDatabase)$'
          go test ./service/agentstatus -run 'TestRunDefaultInstallCommandPreservesStructuredArguments$'
          go test ./service/browser -run 'TestStableChromeDevToolsActivePortPathUsesLocalAppDataOnWindows$'
          go test ./service/workspace -run 'Test(ResolveAppEntrypoint|TerminalServiceCreatesLocalPTY|TerminalServiceAttachStream|AppCenterServiceInitializesBuiltinCatalogAndInstallState)'
          go test ./integration -run 'TestTuttidBlackBoxWorkspaceTerminalWebSocket'
          Pop-Location

      - name: Test Desktop lifecycle
        shell: pwsh
        run: >-
          node --import ./apps/desktop/test/register-asset-stub.mjs
          --test --experimental-strip-types
          ./apps/desktop/src/main/daemon/tuttidManager.test.ts

      - name: Typecheck Desktop
        shell: pwsh
        run: pnpm --filter @tutti-os/desktop typecheck

      - name: Build unsigned Windows NSIS package
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter @tutti-os/desktop build:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: tutti-windows-amd64-alpha
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/*.yml
          if-no-files-found: error
